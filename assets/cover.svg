<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="100%" height="100%">
  <!-- Definitions for gradients and grids -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="400" fill="url(#bgGrad)" />
  <rect width="1600" height="400" fill="url(#grid)" />

  <!-- Abstract Glowing Shapes -->
  <circle cx="200" cy="100" r="300" fill="#6366F1" opacity="0.15" filter="blur(80px)" />
  <circle cx="1400" cy="300" r="250" fill="#EC4899" opacity="0.1" filter="blur(80px)" />
  <circle cx="800" cy="200" r="200" fill="#A855F7" opacity="0.12" filter="blur(60px)" />

  <!-- Geometric Decorative Lines -->
  <g stroke="url(#brandGrad)" stroke-width="2" opacity="0.4" fill="none">
    <path d="M-100,200 Q200,50 600,250 T1300,100 T1700,300" />
    <path d="M-100,250 Q250,100 700,300 T1400,150 T1700,350" stroke-dasharray="10 5" />
  </g>

  <!-- Typography and Branding -->
  <g transform="translate(100, 140)">
    <!-- Subtitle / Tag -->
    <rect x="0" y="0" width="180" height="32" rx="16" fill="url(#brandGrad)" opacity="0.2" />
    <text x="90" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#F43F5E" text-anchor="middle" letter-spacing="1.5">ASTRONA PATH</text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#F8FAFC" letter-spacing="-1">Learning Journey Blueprint</text>

    <!-- Description -->
    <text x="0" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94A3B8">Curate. Sequence. Build. Deploy.</text>
  </g>

  <!-- Decorative Badge/Graphic on the right side -->
  <g transform="translate(1300, 200)" stroke="url(#brandGrad)" stroke-width="3" fill="none" opacity="0.8">
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" />
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" stroke-dasharray="5 3" />
    <circle cx="0" cy="0" r="20" fill="url(#brandGrad)" opacity="0.7" />
  </g>
</svg>
