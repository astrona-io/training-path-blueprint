apiVersion: content.astrona.io/v1alpha1
kind: TrainingPath
metadata:
  # The unique identifier for this path.
  id: {{ .path_id }}
  # A URL-safe string used for routing and linking (e.g., "getting-started-with-astrona").
  slug: {{ .slug }}
  title: "{{ .title }}"
  description: "{{ .description }}"
  version: "{{ .version }}"
  language: "{{ .language }}"
  authors:
    - "{{ .author_name }}"
  tags:
    - "beginner"
    - "core-concepts"
  license: "{{ .license }}"

spec:
  # Who should take this path? (e.g., "Junior System Administrators", "Network Engineers")
  audience: "Intended audience description"
  
  # Recommended difficulty: Beginner, Intermediate, Advanced, or Expert.
  difficulty: "Beginner"
  
  # Approximate time to complete the entire path (e.g., "4h", "2d", "3w").
  estimatedDuration: "4h"

  # What the learner must know or complete before starting this path.
  prerequisites:
    - "Basic understanding of Linux command-line operations."
    - "Completion of ATP001 (Recommended)."

  # High-level, measurable goals the learner will achieve by completing this path.
  # Use action verbs (e.g., "Deploy", "Analyze", "Configure").
  learningOutcomes:
    - "Identify core components of the system."
    - "Configure a basic environment from scratch."

  # Stages define the structured progression of the path.
  # Learners must complete stages in this order.
  stages:
    - id: "stage-1"
      title: "Introduction and Fundamentals"
      description: "Establish baseline knowledge of core concepts."
      # Stage-specific outcomes that build toward the overall learningOutcomes.
      learningOutcomes:
        - "Define terminology used in the ecosystem."
      
      # Content references the Astrona Training Specifications (ATS) that hold the actual educational material.
      # NEVER put reading material, labs, or exercises directly in this file.
      # Note: All referenced specs are required to build successfully and must be fully reachable.
      content:
        - ref: ATS010
          # Git SSH/HTTPS repository URL hosting the spec.
          repository: "git@github.com:astrona-io/ATS010.git"
          # Directory path within the repository where the specification files reside.
          path: "."
          # The exact, fixed version of the specification to lock down builds deterministically.
          version: "1.0.0"
          
        - ref: ATS012
          repository: "git@github.com:astrona-io/ATS012.git"
          path: "modules/advanced"
          version: "1.2.0"

    - id: "stage-2"
      title: "Hands-on Practice"
      description: "Apply fundamental knowledge in sandboxed environments."
      learningOutcomes:
        - "Deploy a working configuration using the CLI."
      content:
        - ref: ATS015
          repository: "git@github.com:astrona-io/ATS015.git"
          path: "labs/lab-1"
          version: "2.0.0"

  # Where should the learner go after completing this path?
  recommendedNextPaths:
    - ATPyyy
