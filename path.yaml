apiVersion: content.astrona.io/v1alpha1
kind: TrainingPath
metadata:
  # The unique identifier for this path.
  id: {{ .path_id }}
  # A URL-safe string used for routing and linking (e.g., "getting-started-with-astrona").
  slug: {{ .slug }}
  title: "{{ .title }}"
  description: "{{ .description }}"
  version: "{{ .version }}"
  language: "{{ .language }}"
  authors:
    - "{{ .author_name }}"
  tags:
    - "cncf-exam-prep"
    - "cka"
    - "kubernetes"
  license: "{{ .license }}"

spec:
  # Who should take this path? (e.g., "Junior System Administrators", "Network Engineers")
  audience: "Intended audience description"
  
  # Recommended difficulty: Beginner, Intermediate, Advanced, or Expert.
  difficulty: "Beginner"
  
  # Approximate time to complete the entire path (e.g., "4h", "2d", "3w").
  estimatedDuration: "4h"

  # Optional: For paths designed specifically as certification or exam preparation courses.
  examPreparation:
    enabled: true
    title: "Linux Foundation Certified System Administrator (LFCS)"
    # The official URL detailing the exam competencies and domain distributions.
    officialSyllabusUrl: "https://training.linuxfoundation.org/certification/linux-foundation-certified-sysadmin-lfcs/"
    examId: "LFCS"
    provider: "The Linux Foundation"

  # What the learner must know or complete before starting this path.
  prerequisites:
    - "Basic understanding of Linux command-line operations."
    - "Completion of ATP001 (Recommended)."

  # High-level, measurable goals the learner will achieve by completing this path.
  # Use action verbs (e.g., "Deploy", "Analyze", "Configure").
  learningOutcomes:
    - "Identify core components of the system."
    - "Configure a basic environment from scratch."

  # Stages define the structured progression of the path (domains covering a full course).
  # Learners must complete stages in this order.
  stages:
    - id: "domain-cluster-setup"
      title: "Cluster Architecture, Installation & Configuration"
      description: "Setup and configure Kubernetes clusters securely."
      # The percentage weight representing this domain's impact on the actual certification exam.
      # For CNCF Exam preparations, this aligns with the official exam blueprint (e.g., 25 represents 25%).
      weight: 25
      learningOutcomes:
        - "Initialize a multi-node cluster using kubeadm."
      
      # Content references the Astrona Training Specifications (ATS) that hold the actual educational material.
      # Note: All referenced specs are required to build successfully and must be fully reachable.
      content:
        - ref: ATS010
          # Git SSH/HTTPS repository URL hosting the spec.
          repository: "git@github.com:astrona-io/ATS010.git"
          # Directory path within the repository where the specification files reside.
          path: "."
          # The exact, fixed version of the specification to lock down builds deterministically.
          version: "1.0.0"

    - id: "domain-networking"
      title: "Services & Networking"
      description: "Manage core cluster networking and Service discovery."
      weight: 20
      learningOutcomes:
        - "Deploy and configure CoreDNS and network policies."
      content:
        - ref: ATS012
          repository: "git@github.com:astrona-io/ATS012.git"
          path: "modules/networking"
          version: "1.2.0"

    - id: "domain-troubleshooting"
      title: "Troubleshooting & Debugging"
      description: "Diagnose application and control-plane issues."
      weight: 30
      learningOutcomes:
        - "Isolate and remediate broken cluster components."
      content:
        - ref: ATS015
          repository: "git@github.com:astrona-io/ATS015.git"
          path: "labs/debugging"
          version: "2.0.0"

  # Where should the learner go after completing this path?
  recommendedNextPaths:
    - ATPyyy
